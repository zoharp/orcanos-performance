app = 'orcanos-performance'
primary_region = 'ams'

[build]

[env]
  DATABASE_URL = "sqlite:////data/orcanos_performance.db"
  SCENARIOS_DIR = "/data/scenarios"
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'orcanos_data'
  destination = '/data'
